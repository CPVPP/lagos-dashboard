<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Database Values Diagnostic Tool</title>
    <style>
        body { background: #111; color: #ccc; font-family: 'Courier New', monospace; padding: 20px; line-height: 1.6; }
        h2 { color: #fff; border-bottom: 2px solid #333; padding-bottom: 10px; }
        h3 { color: #00cc44; margin-top: 20px; }
        .red { color: #ff6b6b; font-weight: bold; }
        .yellow { color: #fee08b; }
        .green { color: #00cc44; }
        .box { background: #222; padding: 15px; border-radius: 5px; margin-bottom: 20px; border: 1px solid #333; }
        ul { margin-top: 5px; }
        li { margin-bottom: 4px; }
    </style>
</head>
<body>
    <h2>Unique Values Diagnostic</h2>
    <div id="output">Fetching all rows to extract unique categories... Please wait...</div>

    <script src="config.js"></script>
    <script>
        async function runDiagnostics() {
            const out = document.getElementById('output');
            let allData = [];
            let offset = 0;
            const limit = 1000; 
            let keepFetching = true;

            try {
                // Fetch all data
                while (keepFetching) {
                    const response = await fetch(
                        `${CONFIG.SUPABASE_URL}/rest/v1/${CONFIG.TABLE}?select=safety_feeling,community_mood,violence_witnessed_binary,tensions_noticed_binary&limit=${limit}&offset=${offset}`,
                        { headers: { apikey: CONFIG.SUPABASE_ANON_KEY, Authorization: `Bearer ${CONFIG.SUPABASE_ANON_KEY}` } }
                    );
                    if (!response.ok) throw new Error(`HTTP Error: ${response.status}`);
                    const chunk = await response.json();
                    allData = allData.concat(chunk);
                    if (chunk.length < limit) keepFetching = false;
                    else offset += limit;
                }

                // Use Sets to capture only unique values
                const uniqueSafety = new Set();
                const uniqueMood = new Set();
                const uniqueViolence = new Set();
                const uniqueTension = new Set();

                allData.forEach(row => {
                    uniqueSafety.add(row.safety_feeling);
                    uniqueMood.add(row.community_mood);
                    
                    // We also capture the exact data type (number vs string vs null)
                    let vVal = row.violence_witnessed_binary === null ? "null" : `${row.violence_witnessed_binary} (${typeof row.violence_witnessed_binary})`;
                    uniqueViolence.add(vVal);
                    
                    let tVal = row.tensions_noticed_binary === null ? "null" : `${row.tensions_noticed_binary} (${typeof row.tensions_noticed_binary})`;
                    uniqueTension.add(tVal);
                });

                // Render Results
                let html = `
                    <div class="box">
                        <h3>1. Safety Feeling Categories (safety_feeling)</h3>
                        <p>If these don't match ['very_unsafe', 'unsafe', 'neutral', 'safe', 'very_safe'], the chart will break.</p>
                        <ul>${Array.from(uniqueSafety).map(v => `<li class="yellow">${v}</li>`).join('')}</ul>
                    </div>

                    <div class="box">
                        <h3>2. Community Mood Categories (community_mood)</h3>
                        <ul>${Array.from(uniqueMood).map(v => `<li class="green">${v}</li>`).join('')}</ul>
                    </div>

                    <div class="box border-red">
                        <h3 class="red">3. Violence Witnessed Binary</h3>
                        <p>We are expecting the number 1 or 0. If it says "string", our strict === 1 logic is failing.</p>
                        <ul>${Array.from(uniqueViolence).map(v => `<li class="yellow">${v}</li>`).join('')}</ul>
                    </div>

                    <div class="box border-red">
                        <h3 class="red">4. Tensions Noticed Binary</h3>
                        <p>We are expecting the number 1 or 0.</p>
                        <ul>${Array.from(uniqueTension).map(v => `<li class="yellow">${v}</li>`).join('')}</ul>
                    </div>
                `;

                out.innerHTML = html;

            } catch (err) {
                out.innerHTML = `<h3 class="red">Error: ${err.message}</h3>`;
            }
        }
        
        runDiagnostics();
    </script>
</body>
</html>
